name: Seguridad

# Automatizacion de seguridad en CI (Fase 3 de la auditoria):
# - CodeQL: analisis estatico (SAST) del codigo Java.
# - dependency-review: bloquea PRs que introduzcan dependencias vulnerables.
# - gitleaks: escaneo de secretos filtrados en el codigo/historial.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Java)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Compilar
        run: mvn -B -ntp -DskipTests compile
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Revision de dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  gitleaks:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
