# ===========================================================================
# Configuracion base: se carga SIEMPRE, con o sin perfil activo.
# El entorno (Render) no define SPRING_PROFILES_ACTIVE, por lo que
# application-prod.properties no se carga; el pool debe vivir aqui para
# aplicarse igual.
# ===========================================================================

# Pool de conexiones (HikariCP) afinado para Postgres serverless (Neon).
# Con el default (minimum-idle = maximum-pool-size = 10) el backend mantiene
# conexiones abiertas 24/7 y el compute de Neon nunca se suspende, consumiendo
# compute hours de forma continua. Con minimum-idle=0 e idle-timeout corto, sin
# trafico se cierran todas las conexiones y Neon puede escalar a cero.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=20000
# No abortar el arranque si la BD esta temporalmente inaccesible (p. ej. cuota excedida).
spring.datasource.hikari.initialization-fail-timeout=-1
