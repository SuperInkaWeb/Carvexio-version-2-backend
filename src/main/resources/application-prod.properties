# Configuration for Production
spring.application.name=automotriz

# Database Configuration
# Uses environment variables for security and flexibility
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/automotriz_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# 'validate' ensures the schema matches the entities without modifying it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
# MUST be provided as an environment variable in production
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# MercadoPago Configuration
mercadopago.public.key=${MERCADOPAGO_PUBLIC_KEY}
mercadopago.access.token=${MERCADOPAGO_ACCESS_TOKEN}
mercadopago.collector.id=${MERCADOPAGO_COLLECTOR_ID}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=ERROR




